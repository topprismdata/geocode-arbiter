[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geocode-arbiter"
version = "0.1.0"
description = "Dual-source geocoding arbitration per GeoGov R018/R019/R025/R031: pluggable providers, abstain path, full decision trace, never silent overwrite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TopPrism WP04" }]
dependencies = [
    "coords-core @ git+https://github.com/topprismdata/coords-core.git@v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
geocode-arbiter = "geocode_arbiter.cli:main"

[tool.setuptools.packages.find]
include = ["geocode_arbiter*"]
